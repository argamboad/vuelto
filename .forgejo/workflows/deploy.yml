# Deploy a commit that is ALREADY green (LOCALCI-4, ADR-028 addendum 2026-09-22).
#
# `ci.yml` can deploy too: pick `deploy=staging` there and it re-runs every gate first (~15 min). That is
# the right button when the commit has not been tested yet. This workflow is the other half: the merge run
# just went green, nothing changed since, and re-running the same gates to publish it is ten minutes of a
# laptop you are also working on.
#
# It does NOT take anyone's word for "it was green". Before touching anything it asks this Forgejo's own
# API which jobs ran for THIS commit and requires the newest attempt of every gate to be a success, every
# matrix leg included, and any native smoke that ran to have passed. Anything else — a missing job, a
# failure, a re-run still going, a docs-only run that skipped the gates, an API it cannot reach — stops
# the deploy and tells you to use ci.yml's deploy input instead. The job token can read that API (probed
# 2026-09-22). Treat it as able to write (v4 audit DEP-14): the checkout below keeps no copy of it, and the
# branch protection ci.yml checks on every run is what stops it pushing.
#
# The deploy steps themselves are identical to ci.yml's deploy jobs: push the commit to the same branch on
# GitHub (fast-forward, never forced), fire the Render hook, wait for the service to report this commit.
name: Deploy (already green)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy — staging needs develop, prod needs main
        type: choice
        default: staging
        options: [staging, prod]

# `permissions:` is left out: Forgejo does not support that key (it warns and ignores it), so the job token
# is treated as able to write. Why that is safe here: the note above ci.yml's `defaults:` (v4 audit DEP-14/27).

defaults:
  run:
    shell: bash -e {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.event.inputs.target }}
      cancel-in-progress: true
    steps:
      - name: The branch must match the target
        run: |
          case "${{ github.event.inputs.target }}:${{ github.ref }}" in
            staging:refs/heads/develop|prod:refs/heads/main) ;;
            *) echo "::error::staging deploys from develop and prod from main — ${{ github.ref }} is neither for target '${{ github.event.inputs.target }}'."; exit 1 ;;
          esac

      - name: This commit must already be green
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # ci.yml's own matrix sizes (native-build legs, e2e shards); ForgejoCiParityTests holds them equal.
          NATIVE_LEGS: 2
          E2E_SHARDS: 3
        run: |
          # ci-logic begin: already-green
          command -v jq > /dev/null || { echo "::error::jq is missing from the runner image — cannot verify, refusing to deploy."; exit 1; }

          # Job-level history, newest first. Five pages is far more than a day of runs on this instance.
          : > /tmp/jobs.json
          for page in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page.json -w "%{http_code}" -H "Authorization: token $TOKEN" \
                   "$API/actions/tasks?limit=50&page=$page")
            [ "$code" = "200" ] || { echo "::error::the Actions API answered $code — cannot verify this commit, refusing to deploy. Use ci.yml's deploy input, which runs the gates itself."; exit 1; }
            jq -c '.workflow_runs[]? | select(.head_sha == env.SHA and .workflow_id == "ci.yml")' /tmp/page.json >> /tmp/jobs.json
            [ "$(jq '.workflow_runs | length' /tmp/page.json)" -lt 50 ] && break
          done

          # Only the newest attempt of each job counts (v4 LB-DEP-3): a job that passed and was re-run red is red,
          # and a re-run still going is not green yet. Any success found, however old, used to be enough.
          jq -cs 'group_by(.name) | map(max_by(.id)) | .[]' /tmp/jobs.json > /tmp/newest.json
          status() { jq -r --arg n "$1" 'select(.name == $n) | .status' /tmp/newest.json; }
          missing=""
          for job in changes build-test secret-scan qa-artifacts license-scan docker-build; do
            [ "$(status "$job")" = "success" ] || missing="$missing $job"
          done
          # Matrix jobs: EVERY leg must be green — one red leg refuses even when the green ones reach the
          # count — and the count must reach ci.yml's own matrix size, so a half-run is not green either.
          for matrix in "native-build:$NATIVE_LEGS" "e2e:$E2E_SHARDS"; do
            name="${matrix%%:*}"; want="${matrix##*:}"
            red=$(jq -r --arg p "$name (" 'select(.name | startswith($p)) | select(.status != "success") | "\(.name)=\(.status)"' /tmp/newest.json | paste -sd' ' -)
            ok=$(jq -r --arg p "$name (" 'select(.name | startswith($p)) | select(.status == "success") | .name' /tmp/newest.json | grep -c . || true)
            [ -z "$red" ] || missing="$missing $red"
            [ "$ok" -ge "$want" ] || missing="$missing $name($ok/$want)"
          done
          # A native smoke runs only when it was selected. One that ran must have passed, exactly as ci.yml's
          # deploy jobs require; one that was skipped does not block.
          red=$(jq -r 'select(.name | startswith("native-smoke")) | select(.status != "success" and .status != "skipped") | "\(.name)=\(.status)"' /tmp/newest.json | paste -sd' ' -)
          [ -z "$red" ] || missing="$missing $red"

          if [ -n "$missing" ]; then
            echo "::error::$SHA is not green in its newest ci.yml run:$missing — refusing to deploy. Run ci.yml with deploy=${{ github.event.inputs.target }}, which runs the gates and then deploys."
            exit 1
          fi
          echo "Every gate is green for $SHA in its newest ci.yml run, and every native smoke that ran passed (as ci.yml's deploy requires)."
          # ci-logic end: already-green

      - uses: actions/checkout@v5 # for .github/scripts/deploy-smoke.sh
        with:
          persist-credentials: false # v4 audit DEP-14: never leave the job token in .git/config
          fetch-depth: 0 # the push to GitHub needs the full history, not a shallow tip

      - name: Push the branch to GitHub
        env:
          HOOK: ${{ github.event.inputs.target == 'prod' && secrets.RENDER_DEPLOY_HOOK_PROD || secrets.RENDER_DEPLOY_HOOK_STAGING }}
          MIRROR_TOKEN: ${{ secrets.DEPLOY_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.DEPLOY_MIRROR_REPO }}
        run: bash .forgejo/scripts/push-to-github.sh "${{ github.event.inputs.target == 'prod' && 'main' || 'develop' }}"

      - name: Trigger the Render deploy
        env:
          HOOK: ${{ github.event.inputs.target == 'prod' && secrets.RENDER_DEPLOY_HOOK_PROD || secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no Render deploy hook for ${{ github.event.inputs.target }} — nothing to deploy. Add the secret to enable."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered the Render ${{ github.event.inputs.target }} deploy."

      - name: Wait for the service + smoke test
        env:
          HOOK: ${{ github.event.inputs.target == 'prod' && secrets.RENDER_DEPLOY_HOOK_PROD || secrets.RENDER_DEPLOY_HOOK_STAGING }}
          BASE: ${{ github.event.inputs.target == 'prod' && vars.PROD_BASE_URL || vars.STAGING_BASE_URL }}
          EXPECT: ${{ github.sha }}
          # The superseded-build check asks GitHub's compare API — every deployed commit is on GitHub.
          GH_TOKEN: ${{ secrets.DEPLOY_MIRROR_TOKEN }}
          GITHUB_REPOSITORY: ${{ vars.DEPLOY_MIRROR_REPO }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no deploy hook fired, nothing to smoke."
            exit 0
          fi
          if [ -z "$BASE" ]; then
            echo "::error::a ${{ github.event.inputs.target }} deploy was TRIGGERED but its base URL variable is not set — the deploy cannot be verified."
            exit 1
          fi
          bash .github/scripts/deploy-smoke.sh "$BASE" "$EXPECT"
