# The compose project is "vuelto" (not the folder name): its containers and the dev volume are vuelto-*.
name: vuelto

services:
  db:
    image: ghcr.io/argamboad/postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dev_db}
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # RLS runtime role (ADR-020) — auto-provisioned on a FRESH volume only; for an existing
      # volume run the script once via psql (see the script header).
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-dev_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mail:
    image: ghcr.io/axllent/mailpit:v1.30.4 # pinned, not :latest — matches the CI mail trap (v3 DEP-9)
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1026}:1025"
      - "${MAIL_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The production image, from one origin (ADR-017), behind the "app" profile: `docker compose up -d` still starts only
  # db and mail, and `docker compose --profile app up -d --build` checks that the container that ships boots, migrates
  # and serves. Its build reads the platform's feed with PLATFORM_PACKAGES_TOKEN from .env, as the BuildKit secret
  # `nuget` (in no layer). It loads .env for the app's settings, then reaches the sibling containers by service name.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [nuget]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME:-dev_db};Username=${DB_USER:-dev};Password=${DB_PASSWORD:-devpassword}"
      Email__Smtp__Host: mail
      Email__Smtp__Port: "1025"
      Email__Smtp__Username: ""
      Email__Smtp__Password: ""
      PORT: "8080"
    ports:
      - "${APP_PORT:-8180}:8080"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy

secrets:
  nuget:
    environment: PLATFORM_PACKAGES_TOKEN

volumes:
  db_data:
